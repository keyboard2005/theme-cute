<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{modules/layout :: html(content = ~{::content})}">
  <th:block th:fragment="content">
    <div class="index-content">
      <th:block th:replace="~{modules/header}"></th:block>
      <th:block th:replace="~{modules/topbanner}"></th:block>
      <ul>
        <li th:each="post : ${posts.items}">
          <a th:text="${post.spec.title}" th:href="${post.status.permalink}"></a>
        </li>
      </ul>
    </div>
  </th:block>
</html>
